<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>
    
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
   <div class="quiz-container">
    <h1>🧠 Quiz Application</h1>

    <div class="quiz-info">
        <p id="question-number"> Question 1 of 5 </p>
        <p id="score"> Score: 0 </p>
    </div>


    <h2 id="question">
        Which language is used to create the structure of a webpage ?
    </h2>

    <div id="answer-buttons">
        <button class='answer-btn'>HTML</button>
        <button class='answer-btn'>CSS</button>
        <button class='answer-btn'>Python</button>
        <button class='answer-btn'>Java</button>
    </div>

    <p id="result"></p>

    <button id="next-btn">Next Question</button>
<div>


    <script src="./script.js"></script>
</body>
</html>
